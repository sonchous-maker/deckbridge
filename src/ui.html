<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
      }

      body {
        margin: 0;
        background: var(--figma-color-bg);
        color: var(--figma-color-text);
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
      }

      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
      }

      button {
        width: 100%;
        min-height: 32px;
        border: 1px solid var(--figma-color-border);
        border-radius: 6px;
        font: inherit;
      }

      button {
        border-color: var(--figma-color-bg-brand);
        background: var(--figma-color-bg-brand);
        color: var(--figma-color-text-onbrand);
        cursor: pointer;
        font-weight: 600;
      }

      button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      .actions {
        display: grid;
        gap: 8px;
      }

      .status {
        min-height: 20px;
        color: var(--figma-color-text-secondary);
      }

      .status.error {
        color: var(--figma-color-text-danger);
      }

      .log {
        overflow: auto;
        height: 130px;
        margin: 0;
        padding: 8px;
        border: 1px solid var(--figma-color-border);
        border-radius: 6px;
        background: var(--figma-color-bg-secondary);
        color: var(--figma-color-text-secondary);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.45;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>DeckBridge</h1>
      <div class="actions">
        <button id="export-button" type="button">Export PPTX</button>
        <button id="import-button" type="button">Import PPTX into Figma</button>
        <input id="import-file" type="file" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation" hidden>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">Select frames to export, or import a PPTX file.</div>
      <pre id="log" class="log"></pre>
    </main>
    <!-- UI_SCRIPT -->
  </body>
</html>
